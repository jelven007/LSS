[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "banxia-rustdx-native"
version = "0.1.0"
requires-python = ">=3.9"
description = "Native rustdx market-data bridge for banxia-strategy"
license = { text = "MIT" }

[tool.maturin]
bindings = "pyo3"
module-name = "banxia_rustdx_native"
features = ["pyo3/extension-module"]
