name: banxia-strategy

# Policy backend development stack. The production Web/API is embedded in TSP.
x-app-common: &app-common
  build:
    context: ../..
    dockerfile: Dockerfile
  environment: &app-environment
    TZ: Asia/Shanghai
    BANXIA_ENVIRONMENT: local-compose
    BANXIA_LOG_LEVEL: INFO
    BANXIA_DATA_PROVIDER: ${BANXIA_DATA_PROVIDER:-rustdx}
    BANXIA_RUSTDX_SERVERS: ${BANXIA_RUSTDX_SERVERS:-}
    BANXIA_RUSTDX_TIMEOUT_SECONDS: ${BANXIA_RUSTDX_TIMEOUT_SECONDS:-5}
    BANXIA_METRICS_PORT: 9100
    BANXIA_REPORT_DIRS: /app/reports
    BANXIA_REPORT_OUTPUT_DIR: /app/reports
    BANXIA_REPORT_SCHEDULE: ${BANXIA_REPORT_SCHEDULE:-16:30,23:30}
    BANXIA_REFERENCE_SYNC_SCHEDULE: ${BANXIA_REFERENCE_SYNC_SCHEDULE:-16:20}
    BANXIA_STRATEGY_CONFIG: /app/config/strategy.json
    BANXIA_COLLECTOR_WAL_PATH: /app/data/wal/market-collector.sqlite3
    BANXIA_STORAGE_MODE: required
    BANXIA_POSTGRES_DSN: postgresql://${POSTGRES_USER:-banxia}:${POSTGRES_PASSWORD:-banxia-local}@postgres:5432/${POSTGRES_DB:-banxia}
    BANXIA_CLICKHOUSE_HOST: clickhouse
    BANXIA_CLICKHOUSE_PORT: 8123
    BANXIA_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-banxia}
    BANXIA_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-banxia}
    BANXIA_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-banxia-local}
    BANXIA_REDIS_URL: redis://:${REDIS_PASSWORD:-banxia-local}@redis:6379/0
    BANXIA_OBJECT_ENDPOINT: minio:9000
    BANXIA_OBJECT_ACCESS_KEY: ${MINIO_ROOT_USER:-banxia}
    BANXIA_OBJECT_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-banxia-local-secret}
    BANXIA_OBJECT_SECURE: "false"
    BANXIA_OBJECT_REPORT_BUCKET: strategy-reports
    BANXIA_OBJECT_MARKET_BUCKET: market-raw
    BANXIA_STRATEGY_VERSION: ${BANXIA_STRATEGY_VERSION:-v2}
    BANXIA_CODE_COMMIT: ${BANXIA_CODE_COMMIT:-local}
  volumes:
    - ../../config:/app/config:ro
    - reports:/app/reports
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banxia}
      POSTGRES_USER: ${POSTGRES_USER:-banxia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banxia-local}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-banxia}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-banxia}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-banxia-local}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../../migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-banxia-local}
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --requirepass, "${REDIS_PASSWORD:-banxia-local}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-banxia-local}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Local S3 emulator only; production uses TOS.
  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-banxia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-banxia-local-secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-banxia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-banxia-local-secret}
    volumes:
      - ./minio/create-buckets.sh:/opt/banxia/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/opt/banxia/create-buckets.sh"]
    restart: "no"

  catalog-bootstrap:
    <<: *app-common
    entrypoint: [python, -m, banxia_strategy.catalog_bootstrap]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  market-worker:
    <<: *app-common
    command: [market-worker]
    volumes:
      - ../../config:/app/config:ro
      - collector-wal:/app/data/wal
    depends_on:
      catalog-bootstrap:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  report-scheduler:
    <<: *app-common
    command: [report-scheduler]
    depends_on:
      catalog-bootstrap:
        condition: service_completed_successfully

  report-worker:
    <<: *app-common
    command: [report-worker]
    profiles: [jobs]
    environment:
      <<: *app-environment
      BANXIA_REPORT_DATE: ${BANXIA_REPORT_DATE:-}
    depends_on:
      catalog-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  paper-trading:
    <<: *app-common
    command: [paper-trading]
    profiles: [jobs]
    depends_on:
      catalog-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  market-reference-sync:
    <<: *app-common
    command: [market-reference-sync]
    depends_on:
      catalog-bootstrap:
        condition: service_completed_successfully

  api:
    <<: *app-common
    command: [api]
    environment:
      <<: *app-environment
      BANXIA_API_HOST: 0.0.0.0
      BANXIA_API_PORT: 8765
      BANXIA_API_TOKEN: ${BANXIA_API_TOKEN:-}
      BANXIA_AUTH_ENABLED: ${BANXIA_AUTH_ENABLED:-true}
      BANXIA_AUTH_SECRET: ${BANXIA_AUTH_SECRET:-}
      BANXIA_AUTH_COOKIE_SECURE: ${BANXIA_AUTH_COOKIE_SECURE:-false}
      BANXIA_SMTP_HOST: ${BANXIA_SMTP_HOST:-smtp.126.com}
      BANXIA_SMTP_PORT: ${BANXIA_SMTP_PORT:-465}
      BANXIA_SMTP_USERNAME: ${BANXIA_SMTP_USERNAME:-}
      BANXIA_SMTP_PASSWORD: ${BANXIA_SMTP_PASSWORD:-}
      BANXIA_SMTP_SENDER: ${BANXIA_SMTP_SENDER:-}
    ports:
      - "127.0.0.1:${BANXIA_API_PORT:-8765}:8765"
    depends_on:
      catalog-bootstrap:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
  minio-data:
  collector-wal:
  reports:
  prometheus-data:
