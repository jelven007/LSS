global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: banxia-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8765"]

  - job_name: banxia-workers
    static_configs:
      - targets:
          - market-worker:9100
          - report-scheduler:9100
          - market-reference-sync:9100
