global:
  scrape_interval: 10s
  evaluation_interval: 15s
rule_files:
  - /etc/banxia-rules/collector-alerts.yaml
scrape_configs:
  - job_name: banxia-market-collector
    scrape_timeout: 5s
    static_configs:
      - targets:
          - market-collector-0.market-collector.banxia.svc.cluster.local:9100
        labels: {namespace: banxia, pod: market-collector-0}
      - targets:
          - market-collector-1.market-collector.banxia.svc.cluster.local:9100
        labels: {namespace: banxia, pod: market-collector-1}
