apiVersion: v1
kind: ConfigMap
metadata:
  name: banxia-runtime
  namespace: banxia
data:
  BANXIA_CLICKHOUSE_HOST: clickhouse
  BANXIA_CLICKHOUSE_PORT: "8123"
  BANXIA_CLICKHOUSE_NATIVE_PORT: "9000"
  BANXIA_CLICKHOUSE_DATABASE: banxia
  BANXIA_CLICKHOUSE_USER: banxia
