apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banxia-api
  namespace: banxia
  labels:
    app.kubernetes.io/name: banxia-strategy
spec:
  namespaceSelector:
    matchNames: [banxia]
  selector:
    matchLabels:
      app: banxia-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banxia-flink
  namespace: banxia
  labels:
    app.kubernetes.io/name: banxia-strategy
spec:
  namespaceSelector:
    matchNames: [banxia]
  selector:
    matchLabels:
      app: banxia-flink
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: banxia-market-collector
  namespace: banxia
  labels:
    app.kubernetes.io/name: banxia-strategy
spec:
  namespaceSelector:
    matchNames: [banxia]
  selector:
    matchLabels:
      app: banxia-market-collector
  podMetricsEndpoints:
    - port: metrics
      interval: 10s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: banxia-workers
  namespace: banxia
  labels:
    app.kubernetes.io/name: banxia-strategy
spec:
  namespaceSelector:
    matchNames: [banxia]
  selector:
    matchLabels:
      component: worker
    matchExpressions:
      - key: app
        operator: NotIn
        values: [banxia-market-collector]
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: banxia-flink-taskmanagers
  namespace: banxia
  labels:
    app.kubernetes.io/name: banxia-strategy
spec:
  namespaceSelector:
    matchNames: [banxia]
  selector:
    matchLabels:
      app: banxia-flink
      role: taskmanager
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
