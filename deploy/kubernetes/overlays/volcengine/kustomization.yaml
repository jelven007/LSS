apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../../../product/deploy/kubernetes
  - storage.yaml
  - tsp-storage.yaml
  - data-services.yaml
  - ingress.yaml
  - migration-job.yaml
  - bootstrap-job.yaml
  - collector-statefulset.yaml
  - network-policy.yaml
  - servicemonitor.yaml
  - intraday-monitor.yaml
patches:
  - path: runtime-config.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
    path: scheduling-patch.yaml
  - target:
      group: apps
      version: v1
      kind: StatefulSet
    path: scheduling-patch.yaml
images:
  - name: banxia-strategy
    newName: xm1001-cn-shanghai.cr.volces.com/banxia/banxia-strategy
    newTag: v0.5.1
    digest: sha256:3f569013ce24412457b1d9c118921cd0b45157b09984b3e39775681d7e0bc789
  - name: tsp-product-runtime
    newName: xm1001-cn-shanghai.cr.volces.com/banxia/banxia-strategy
    newTag: web-v0.5.1
  - name: tsp-product-compute
    newName: xm1001-cn-shanghai.cr.volces.com/banxia/banxia-strategy
    newTag: compute-v0.5.1
  - name: postgres
    newName: xm1001-cn-shanghai.cr.volces.com/banxia/postgres
    newTag: 16.4-alpine
  - name: redis
    newName: xm1001-cn-shanghai.cr.volces.com/banxia/redis
    newTag: 7.4.1-alpine
  - name: clickhouse/clickhouse-server
    newName: xm1001-cn-shanghai.cr.volces.com/banxia/clickhouse
    newTag: "24.8"
configMapGenerator:
  - name: banxia-intraday-prometheus
    namespace: banxia
    files:
      - ../../../observability/collector-prometheus.yml
  - name: banxia-intraday-alerts
    namespace: banxia
    files:
      - ../../../observability/collector-alerts.yaml
  - name: banxia-postgres-migrations
    namespace: banxia
    files:
      - ../../../../migrations/postgres/001_initial.sql
      - ../../../../migrations/postgres/002_outbox_leases.sql
      - ../../../../migrations/postgres/003_outbox_event_identity.sql
      - ../../../../migrations/postgres/004_strategy_research.sql
      - ../../../../migrations/postgres/005_multi_strategy.sql
      - ../../../../migrations/postgres/006_immutable_active_strategy.sql
      - ../../../../migrations/postgres/007_mutable_strategy_name.sql
      - ../../../../migrations/postgres/008_strategy_cascade_delete.sql
      - ../../../../migrations/postgres/009_initial_strategy_defaults.sql
      - ../../../../migrations/postgres/010_execution_comparison.sql
      - ../../../../migrations/postgres/011_market_reference.sql
      - ../../../../migrations/postgres/012_security_daily_snapshot.sql
      - ../../../../migrations/postgres/013_identity_and_new_boards.sql
      - ../../../../migrations/postgres/014_user_watchlist.sql
      - ../../../../migrations/postgres/015_strategy_archetypes.sql
      - ../../../../migrations/postgres/016_limit_up_history.sql
      - ../../../../migrations/postgres/017_limit_up_exclusions.sql
      - ../../../../migrations/postgres/018_first_board_quality_filters.sql
      - ../../../../migrations/postgres/019_first_board_positive_return_gate.sql
      - ../../../../migrations/postgres/020_paper_trading_campaign.sql
      - ../../../../migrations/postgres/021_fusion_l7_paper_campaign.sql
      - ../../../../migrations/postgres/022_fusion_l7_candidate.sql
      - ../../../../migrations/postgres/023_fusion_l7_t1_exit.sql
      - ../../../../migrations/postgres/024_unified_leader_catalog.sql
      - ../../../../migrations/postgres/025_mainline_leader_paper_campaign.sql
      # 026/027 (operational V1->V2->V2.1 upgrade) are intentionally NOT applied
      # in production: the live operational strategy stays on V1. 028 freezes a
      # V2.1 config into a dedicated paper campaign only. Keep 026/027 for dev
      # and the isolated migration tests; add them here only to deliberately
      # promote the operational strategy to V2.1.
      - ../../../../migrations/postgres/028_mainline_leader_v2_paper_campaign.sql
  - name: banxia-clickhouse-migrations
    namespace: banxia
    files:
      - ../../../../migrations/clickhouse/001_initial.sql
      - ../../../../migrations/clickhouse/002_stock_history.sql
      - ../../../../migrations/clickhouse/003_market_board_capital.sql
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: banxia-strategy
    app.kubernetes.io/managed-by: kustomize
