apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: banxia
  labels:
    app: banxia-postgres
spec:
  clusterIP: None
  selector:
    app: banxia-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: banxia
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: banxia-postgres
  template:
    metadata:
      labels:
        app: banxia-postgres
        component: datastore
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: banxia-secrets, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: banxia-secrets, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: banxia-secrets, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: TZ, value: Asia/Shanghai}
          ports:
            - {name: postgres, containerPort: 5432}
          startupProbe:
            exec:
              command: [sh, -ec, "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -ec, "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -ec, "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: banxia-ebs-retain
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: banxia
  labels:
    app: banxia-redis
spec:
  clusterIP: None
  selector:
    app: banxia-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: banxia
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: banxia-redis
  template:
    metadata:
      labels:
        app: banxia-redis
        component: datastore
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.1-alpine
          command: [sh, -ec]
          args:
            - |
              exec redis-server \
                --appendonly yes \
                --appendfsync everysec \
                --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: banxia-secrets, key: REDIS_PASSWORD}
          ports:
            - {name: redis, containerPort: 6379}
          startupProbe:
            exec:
              command: [sh, -ec, "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -ec, "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -ec, "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: banxia-ebs-retain
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: banxia
  labels:
    app: banxia-clickhouse
spec:
  clusterIP: None
  selector:
    app: banxia-clickhouse
  ports:
    - {name: http, port: 8123}
    - {name: native, port: 9000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: banxia
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: banxia-clickhouse
  template:
    metadata:
      labels:
        app: banxia-clickhouse
        component: datastore
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          env:
            - name: CLICKHOUSE_DB
              valueFrom:
                secretKeyRef: {name: banxia-secrets, key: CLICKHOUSE_DB}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef: {name: banxia-secrets, key: CLICKHOUSE_USER}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: banxia-secrets, key: CLICKHOUSE_PASSWORD}
            - {name: TZ, value: Asia/Shanghai}
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --query "SELECT 1"
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --query "SELECT 1"
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "3", memory: 5Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: banxia-ebs-retain
        resources:
          requests:
            storage: 40Gi
