apiVersion: v1
kind: Namespace
metadata:
  name: banxia
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: banxia-runtime
  namespace: banxia
data:
  TZ: Asia/Shanghai
  BANXIA_ENVIRONMENT: production
  BANXIA_LOG_LEVEL: INFO
  BANXIA_DATA_PROVIDER: rustdx
  BANXIA_RUSTDX_SERVERS: ""
  BANXIA_RUSTDX_TIMEOUT_SECONDS: "5"
  BANXIA_REPORT_DIRS: /app/reports
  BANXIA_REPORT_OUTPUT_DIR: /app/reports
  BANXIA_REPORT_SCHEDULE: 16:30,23:30
  BANXIA_REFERENCE_SYNC_SCHEDULE: "16:20"
  BANXIA_STRATEGY_CONFIG: /app/config/strategy.json
  BANXIA_COLLECTOR_WAL_PATH: /app/data/wal/market-collector.sqlite3
  BANXIA_STORAGE_MODE: required
  BANXIA_CLICKHOUSE_HOST: REPLACE_WITH_CLICKHOUSE_HOST
  BANXIA_CLICKHOUSE_PORT: "8123"
  BANXIA_CLICKHOUSE_DATABASE: banxia
  BANXIA_CLICKHOUSE_USER: banxia
  BANXIA_OBJECT_ENDPOINT: REPLACE_WITH_TOS_S3_ENDPOINT
  BANXIA_OBJECT_SECURE: "true"
  BANXIA_OBJECT_REGION: REPLACE_WITH_OBJECT_REGION
  BANXIA_OBJECT_REPORT_BUCKET: strategy-reports
  BANXIA_OBJECT_MARKET_BUCKET: market-raw
  BANXIA_STRATEGY_VERSION: v2
  BANXIA_METRICS_PORT: "9100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-reference-sync
  namespace: banxia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: banxia-market-reference-sync}
  template:
    metadata:
      labels: {app: banxia-market-reference-sync, component: worker}
    spec:
      containers:
        - name: market-reference-sync
          image: banxia-strategy:REPLACE_WITH_GIT_COMMIT
          args: [market-reference-sync]
          envFrom:
            - configMapRef: {name: banxia-runtime}
            - secretRef: {name: banxia-secrets}
          ports:
            - {name: metrics, containerPort: 9100}
          livenessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-scheduler
  namespace: banxia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: banxia-report-scheduler}
  template:
    metadata:
      labels: {app: banxia-report-scheduler, component: worker}
    spec:
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: report-scheduler
          image: banxia-strategy:REPLACE_WITH_GIT_COMMIT
          args: [report-scheduler]
          envFrom:
            - configMapRef: {name: banxia-runtime}
            - secretRef: {name: banxia-secrets}
          ports:
            - {name: metrics, containerPort: 9100}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: reports, mountPath: /app/reports}
      volumes:
        - name: reports
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-archive
  namespace: banxia
spec:
  # Enable after valid TOS credentials and the first collected trading day are verified.
  suspend: true
  schedule: "10 0 * * 2-6"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: {app: banxia-market-archive, component: job}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: market-archive
              image: banxia-market-archive:REPLACE_WITH_GIT_COMMIT
              command: [python, -m, banxia_strategy.application.market_archive]
              envFrom:
                - configMapRef: {name: banxia-runtime}
                - secretRef: {name: banxia-secrets}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 1Gi}
                limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 20Gi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: limit-up-history-sync
  namespace: banxia
spec:
  schedule: "35 16 * * 1-5"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: {app: banxia-limit-up-history-sync, component: job}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: limit-up-history-sync
              image: banxia-strategy:REPLACE_WITH_GIT_COMMIT
              args: [limit-up-history-sync]
              envFrom:
                - configMapRef: {name: banxia-runtime}
                - secretRef: {name: banxia-secrets}
              resources:
                requests: {cpu: 500m, memory: 384Mi}
                limits: {cpu: "3", memory: 1536Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stock-history-sync
  namespace: banxia
spec:
  schedule: "5 17 * * 1-5"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: {app: banxia-stock-history-sync, component: job}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: stock-history-sync
              image: banxia-strategy:REPLACE_WITH_GIT_COMMIT
              command: [python, -m, banxia_strategy.stock_history_backfill]
              args: [--incremental, --lookback-days, "14", --batch-size, "10", --workers, "7"]
              envFrom:
                - configMapRef: {name: banxia-runtime}
                - secretRef: {name: banxia-secrets}
              resources:
                requests: {cpu: "1", memory: 768Mi}
                limits: {cpu: "4", memory: 2Gi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: board-capital-sync
  namespace: banxia
spec:
  schedule: "0 18 * * 1-5"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: {app: banxia-board-capital-sync, component: job}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: board-capital-sync
              image: banxia-strategy:REPLACE_WITH_GIT_COMMIT
              command: [python, -m, banxia_strategy.board_capital_backfill]
              args: [--incremental, --lookback-days, "14", --batch-size, "30", --workers, "7"]
              envFrom:
                - configMapRef: {name: banxia-runtime}
                - secretRef: {name: banxia-secrets}
              resources:
                requests: {cpu: "1", memory: 768Mi}
                limits: {cpu: "4", memory: 2Gi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paper-trading-1650
  namespace: banxia
spec:
  schedule: "50 16 * * 1-5"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: {app: banxia-paper-trading, component: job}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: paper-trading
              image: banxia-strategy:REPLACE_WITH_GIT_COMMIT
              args: [paper-trading]
              envFrom:
                - configMapRef: {name: banxia-runtime}
                - secretRef: {name: banxia-secrets}
              resources:
                requests: {cpu: 250m, memory: 256Mi}
                limits: {cpu: "2", memory: 1Gi}
              volumeMounts:
                - {name: reports, mountPath: /app/reports}
          volumes:
            - name: reports
              emptyDir: {}
