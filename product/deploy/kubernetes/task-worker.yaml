apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsp-task-worker
  namespace: banxia
  labels:
    app: tsp-task-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tsp-task-worker
  template:
    metadata:
      labels:
        app: tsp-task-worker
        component: worker
    spec:
      serviceAccountName: banxia-workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: banxia-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-platform-and-schema
          image: tsp-product-runtime:v0.5.1
          command: [/app/.venv/bin/python, -c]
          args:
            - |
              import os
              import time
              from pathlib import Path
              import psycopg
              marker = Path("/state/public/current/.public_release.json")
              for attempt in range(180):
                  try:
                      # API readiness depends on worker heartbeats. Check the
                      # durable prerequisites directly to avoid a startup cycle.
                      with psycopg.connect(os.environ["TSP_CELL_CONTROL_DSN"], connect_timeout=3) as conn:
                          ready = conn.execute("SELECT to_regclass('control.users') IS NOT NULL").fetchone()[0]
                          if ready and marker.is_file():
                              break
                  except Exception:
                      pass
                  if attempt == 179:
                      raise RuntimeError("Platform or database schema is not ready")
                  time.sleep(5)
          envFrom: &runtimeEnv
            - configMapRef:
                name: tsp-product-runtime
            - secretRef:
                name: tsp-product-secrets
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true
          securityContext: &security
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
      containers:
        - name: task-worker
          image: tsp-product-runtime:v0.5.1
          command: [/app/.venv/bin/python, -m, app.multitenancy.task_worker]
          env:
            - name: SERVICE_ROLE
              value: api
            - name: TSP_CELL_WORKER_CONCURRENCY
              value: "4"
          envFrom: *runtimeEnv
          resources:
            requests: {cpu: 350m, memory: 768Mi}
            limits: {cpu: "3", memory: 5Gi}
          securityContext: *security
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tsp-product-state
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
