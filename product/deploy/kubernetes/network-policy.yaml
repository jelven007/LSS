apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lss-product-ingress
  namespace: banxia
spec:
  podSelector:
    matchLabels:
      app: lss-product
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 3018}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lss-platform
  namespace: banxia
spec:
  podSelector:
    matchLabels:
      app: lss-platform
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: banxia
      ports:
        - {protocol: TCP, port: 3018}
