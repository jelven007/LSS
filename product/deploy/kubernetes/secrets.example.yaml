apiVersion: v1
kind: Secret
metadata:
  name: lss-product-admin
  namespace: banxia
type: Opaque
stringData:
  LSS_CONTROL_RUNTIME_PASSWORD: REPLACE_WITH_RANDOM_CONTROL_RUNTIME_PASSWORD
  LSS_DATA_RUNTIME_PASSWORD: REPLACE_WITH_RANDOM_DATA_RUNTIME_PASSWORD
  LSS_CONTROL_ADMIN_DSN: postgresql://banxia:REPLACE_WITH_URLENCODED_POSTGRES_PASSWORD@postgres:5432/lss_control
  LSS_DATA_ADMIN_DSN: postgresql://banxia:REPLACE_WITH_URLENCODED_POSTGRES_PASSWORD@postgres:5432/lss_data_production
  LSS_LEGACY_CONTROL_ADMIN_DSN: postgresql://lss_admin:REPLACE_WITH_URLENCODED_LEGACY_ADMIN_PASSWORD@lss-postgres:5432/lss_control
  LSS_LEGACY_DATA_ADMIN_DSN: postgresql://lss_admin:REPLACE_WITH_URLENCODED_LEGACY_ADMIN_PASSWORD@lss-postgres:5432/lss_data_production
---
apiVersion: v1
kind: Secret
metadata:
  name: lss-product-secrets
  namespace: banxia
type: Opaque
stringData:
  LSS_CELL_CONTROL_DSN: postgresql://lss_control_runtime:REPLACE_WITH_URLENCODED_CONTROL_RUNTIME_PASSWORD@postgres:5432/lss_control
  LSS_CELL_DATA_DSN: postgresql://lss_data_runtime:REPLACE_WITH_URLENCODED_DATA_RUNTIME_PASSWORD@postgres:5432/lss_data_production
  LSS_CELL_MARKET_TOKEN: REPLACE_WITH_RANDOM_MARKET_TOKEN
  LSS_PLATFORM_MARKET_TOKEN: REPLACE_WITH_SAME_RANDOM_MARKET_TOKEN
  LSS_PLATFORM_ADMIN_TOKEN: REPLACE_WITH_INDEPENDENT_RANDOM_ADMIN_TOKEN
  LSS_CELL_STREAM_TICKET_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES
  AUTH_SMTP_HOST: REPLACE_WITH_SMTP_HOST
  AUTH_SMTP_PORT: "465"
  AUTH_SMTP_SECURITY: ssl
  AUTH_SMTP_USERNAME: REPLACE_WITH_SMTP_USERNAME
  AUTH_SMTP_PASSWORD: REPLACE_WITH_SMTP_PASSWORD
  AUTH_SMTP_FROM_ADDRESS: REPLACE_WITH_SMTP_SENDER
