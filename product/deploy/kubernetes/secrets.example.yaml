apiVersion: v1
kind: Secret
metadata:
  name: tsp-product-admin
  namespace: banxia
type: Opaque
stringData:
  TSP_CONTROL_RUNTIME_PASSWORD: REPLACE_WITH_RANDOM_CONTROL_RUNTIME_PASSWORD
  TSP_DATA_RUNTIME_PASSWORD: REPLACE_WITH_RANDOM_DATA_RUNTIME_PASSWORD
  TSP_CONTROL_ADMIN_DSN: postgresql://banxia:REPLACE_WITH_URLENCODED_POSTGRES_PASSWORD@postgres:5432/tsp_control
  TSP_DATA_ADMIN_DSN: postgresql://banxia:REPLACE_WITH_URLENCODED_POSTGRES_PASSWORD@postgres:5432/tsp_data_production
  TSP_LEGACY_CONTROL_ADMIN_DSN: postgresql://tsp_admin:REPLACE_WITH_URLENCODED_LEGACY_ADMIN_PASSWORD@tsp-postgres:5432/tsp_control
  TSP_LEGACY_DATA_ADMIN_DSN: postgresql://tsp_admin:REPLACE_WITH_URLENCODED_LEGACY_ADMIN_PASSWORD@tsp-postgres:5432/tsp_data_production
---
apiVersion: v1
kind: Secret
metadata:
  name: tsp-product-secrets
  namespace: banxia
type: Opaque
stringData:
  TSP_CELL_CONTROL_DSN: postgresql://tsp_control_runtime:REPLACE_WITH_URLENCODED_CONTROL_RUNTIME_PASSWORD@postgres:5432/tsp_control
  TSP_CELL_DATA_DSN: postgresql://tsp_data_runtime:REPLACE_WITH_URLENCODED_DATA_RUNTIME_PASSWORD@postgres:5432/tsp_data_production
  TSP_CELL_MARKET_TOKEN: REPLACE_WITH_RANDOM_MARKET_TOKEN
  TSP_PLATFORM_MARKET_TOKEN: REPLACE_WITH_SAME_RANDOM_MARKET_TOKEN
  TSP_PLATFORM_ADMIN_TOKEN: REPLACE_WITH_INDEPENDENT_RANDOM_ADMIN_TOKEN
  TSP_CELL_STREAM_TICKET_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES
  AUTH_SMTP_HOST: REPLACE_WITH_SMTP_HOST
  AUTH_SMTP_PORT: "465"
  AUTH_SMTP_SECURITY: ssl
  AUTH_SMTP_USERNAME: REPLACE_WITH_SMTP_USERNAME
  AUTH_SMTP_PASSWORD: REPLACE_WITH_SMTP_PASSWORD
  AUTH_SMTP_FROM_ADDRESS: REPLACE_WITH_SMTP_SENDER
