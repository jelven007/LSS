apiVersion: v1
kind: ConfigMap
metadata:
  name: tsp-product-runtime
  namespace: banxia
data:
  TZ: Asia/Shanghai
  MULTITENANCY_ENABLED: "true"
  TSP_CELL_ID: production
  TSP_CELL_SCHEMA_VERSION: "6"
  TSP_CELL_POOL_SIZE: "8"
  TSP_CELL_MARKET_URL: http://tsp-platform:3018
  TSP_CELL_WEBHOOK_ORIGINS: '["https://shanao.asia"]'
  TSP_COMPUTE_ADDRESS: tsp-compute:7000
  DATA_DIR: /state/public/current
  PLATFORM_CONFIG_DIR: /state/platform-config
  TENANT_ARTIFACTS_DIR: /state/tenant-artifacts
  TICKFLOW_ENV_FILE: /dev/null
  POLICY_SERVICE_URL: embedded://policy
  POLICY_SERVICE_TIMEOUT_SECONDS: "30"
  POLARS_MAX_THREADS: "2"
  NUMBA_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  NUMBA_CACHE_DIR: /tmp/numba
  PYTHONDONTWRITEBYTECODE: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: tsp-product
  namespace: banxia
  labels:
    app: tsp-product
spec:
  selector:
    app: tsp-product
  ports:
    - name: http
      port: 80
      targetPort: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsp-product
  namespace: banxia
  labels:
    app: tsp-product
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tsp-product
  template:
    metadata:
      labels:
        app: tsp-product
        component: web
    spec:
      serviceAccountName: banxia-workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: banxia-registry
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-platform-and-schema
          image: tsp-product-runtime:v0.5.1
          command: [/bin/sh, -ec]
          args:
            - |
              /app/.venv/bin/python - <<'PY'
              import os
              import time
              from pathlib import Path

              import psycopg

              dsn = os.environ["TSP_CELL_CONTROL_DSN"]
              marker = Path("/state/public/current/.public_release.json")
              for attempt in range(180):
                  schema_ready = False
                  try:
                      with psycopg.connect(dsn, connect_timeout=3) as conn:
                          schema_ready = bool(
                              conn.execute(
                                  "SELECT to_regclass('control.users') IS NOT NULL"
                              ).fetchone()[0]
                          )
                  except Exception:
                      pass
                  if schema_ready and marker.is_file():
                      raise SystemExit(0)
                  if attempt == 179:
                      raise RuntimeError("TSP platform or database schema did not become ready")
                  time.sleep(5)
              PY
          envFrom: &runtimeEnv
            - configMapRef:
                name: tsp-product-runtime
            - secretRef:
                name: tsp-product-secrets
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true
          securityContext: &runtimeSecurity
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: api
          image: tsp-product-runtime:v0.5.1
          command:
            - /app/.venv/bin/python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "3018"
            - --workers
            - "1"
            - --proxy-headers
            - --forwarded-allow-ips
            - "*"
          env:
            - name: SERVICE_ROLE
              value: api
            - name: BANXIA_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: banxia-secrets
                  key: BANXIA_POSTGRES_DSN
            - name: BANXIA_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banxia-secrets
                  key: BANXIA_CLICKHOUSE_PASSWORD
            - name: BANXIA_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: banxia-secrets
                  key: BANXIA_REDIS_URL
            - name: BANXIA_OBJECT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: banxia-secrets
                  key: BANXIA_OBJECT_ACCESS_KEY
            - name: BANXIA_OBJECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: banxia-secrets
                  key: BANXIA_OBJECT_SECRET_KEY
            - name: BANXIA_CODE_COMMIT
              valueFrom:
                secretKeyRef:
                  name: banxia-secrets
                  key: BANXIA_CODE_COMMIT
          envFrom:
            - configMapRef:
                name: tsp-product-runtime
            - secretRef:
                name: tsp-product-secrets
            - configMapRef:
                name: banxia-runtime
          ports:
            - name: api
              containerPort: 3018
          startupProbe:
            httpGet:
              path: /health/live
              port: api
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: api
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: api
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 6Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts: &runtimeMounts
            - name: state
              mountPath: /state
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: task-worker
          image: tsp-product-runtime:v0.5.1
          command: [/app/.venv/bin/python, -m, app.multitenancy.task_worker]
          env:
            - name: SERVICE_ROLE
              value: api
            - name: TSP_CELL_WORKER_CONCURRENCY
              value: "4"
          envFrom: *runtimeEnv
          resources:
            requests:
              cpu: 350m
              memory: 768Mi
            limits:
              cpu: "3"
              memory: 5Gi
          securityContext: *runtimeSecurity
          volumeMounts: *runtimeMounts
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tsp-product-state
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tsp-product
  namespace: banxia
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tsp-product
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsp-product
  namespace: banxia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsp-product
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
