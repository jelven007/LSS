apiVersion: v1
kind: ConfigMap
metadata:
  name: tsp-product-runtime
  namespace: banxia
data:
  TZ: Asia/Shanghai
  MULTITENANCY_ENABLED: "true"
  TSP_CELL_ID: production
  TSP_CELL_SCHEMA_VERSION: "6"
  TSP_CELL_POOL_SIZE: "8"
  TSP_CELL_MARKET_URL: http://tsp-platform:3018
  TSP_CELL_WEBHOOK_ORIGINS: '["https://shanao.asia"]'
  TSP_COMPUTE_SOCKET: /run/tsp/compute.sock
  TSP_COMPUTE_IMAGE: xm1001-cn-shanghai.cr.volces.com/banxia/banxia-strategy@sha256:21d149be6b92a8077ae5729e0eba9b78d57d71c99c6eb291dea26abdb8c41620
  DATA_DIR: /state/public/current
  PLATFORM_CONFIG_DIR: /state/platform-config
  TENANT_ARTIFACTS_DIR: /state/tenant-artifacts
  TICKFLOW_ENV_FILE: /dev/null
  POLICY_SERVICE_URL: http://api.banxia.svc.cluster.local
  POLICY_SERVICE_TIMEOUT_SECONDS: "30"
  POLARS_MAX_THREADS: "2"
  NUMBA_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  NUMBA_CACHE_DIR: /tmp/numba
  PYTHONDONTWRITEBYTECODE: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: tsp-product
  namespace: banxia
  labels:
    app: tsp-product
spec:
  selector:
    app: tsp-product
  ports:
    - name: http
      port: 80
      targetPort: api
    - name: events
      port: 81
      targetPort: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsp-product
  namespace: banxia
  labels:
    app: tsp-product
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tsp-product
  template:
    metadata:
      labels:
        app: tsp-product
        component: web
    spec:
      serviceAccountName: banxia-workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: banxia-registry
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-platform-and-schema
          image: tsp-product-runtime:v0.5.0
          command: [/bin/sh, -ec]
          args:
            - |
              /app/.venv/bin/python - <<'PY'
              import os
              import time
              from pathlib import Path

              import psycopg

              dsn = os.environ["TSP_CELL_CONTROL_DSN"]
              marker = Path("/state/public/current/.public_release.json")
              for attempt in range(180):
                  schema_ready = False
                  try:
                      with psycopg.connect(dsn, connect_timeout=3) as conn:
                          schema_ready = bool(
                              conn.execute(
                                  "SELECT to_regclass('control.users') IS NOT NULL"
                              ).fetchone()[0]
                          )
                  except Exception:
                      pass
                  if schema_ready and marker.is_file():
                      raise SystemExit(0)
                  if attempt == 179:
                      raise RuntimeError("TSP platform or database schema did not become ready")
                  time.sleep(5)
              PY
          envFrom:
            - configMapRef:
                name: tsp-product-runtime
            - secretRef:
                name: tsp-product-secrets
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: dind
          image: docker:27-dind
          args:
            - --host=tcp://127.0.0.1:2375
            - --host=unix:///var/run/docker.sock
            - --storage-driver=overlay2
            - --mtu=1450
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          readinessProbe:
            exec:
              command: [docker, info]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: [docker, info]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 6Gi
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-graph
              mountPath: /var/lib/docker
            - name: state
              mountPath: /state
              readOnly: true
        - name: broker
          image: tsp-product-broker:v0.5.0
          command: [/bin/sh, -ec]
          args:
            - |
              until docker info >/dev/null 2>&1; do sleep 2; done
              docker pull "$TSP_COMPUTE_IMAGE"
              rm -f /run/tsp/compute.sock
              exec /app/.venv/bin/python -m app.multitenancy.compute_broker \
                --socket /run/tsp/compute.sock \
                --image "$TSP_COMPUTE_IMAGE" \
                --market-root /state/public \
                --capacity 2
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
          envFrom:
            - configMapRef:
                name: tsp-product-runtime
          readinessProbe:
            exec:
              command:
                - /app/.venv/bin/python
                - -c
                - from app.multitenancy.executor import ComputeExecutor; assert ComputeExecutor('/run/tsp/compute.sock').health()['ready']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /app/.venv/bin/python
                - -c
                - from app.multitenancy.executor import ComputeExecutor; assert ComputeExecutor('/run/tsp/compute.sock').health()['ready']
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: compute-socket
              mountPath: /run/tsp
            - name: state
              mountPath: /state
              readOnly: true
            - name: registry-auth
              mountPath: /root/.docker
              readOnly: true
        - name: api
          image: tsp-product-runtime:v0.5.0
          command:
            - /app/.venv/bin/python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "3018"
            - --workers
            - "1"
            - --proxy-headers
            - --forwarded-allow-ips
            - "*"
          env:
            - name: SERVICE_ROLE
              value: api
          envFrom:
            - configMapRef:
                name: tsp-product-runtime
            - secretRef:
                name: tsp-product-secrets
          ports:
            - name: api
              containerPort: 3018
          startupProbe:
            httpGet:
              path: /health/live
              port: api
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: api
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: api
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 6Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts: &runtimeMounts
            - name: state
              mountPath: /state
              readOnly: true
            - name: compute-socket
              mountPath: /run/tsp
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: gateway
          image: tsp-product-runtime:v0.5.0
          command:
            - /app/.venv/bin/python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "3019"
            - --workers
            - "1"
            - --proxy-headers
            - --forwarded-allow-ips
            - "*"
          env:
            - name: SERVICE_ROLE
              value: gateway
          envFrom: &runtimeEnv
            - configMapRef:
                name: tsp-product-runtime
            - secretRef:
                name: tsp-product-secrets
          ports:
            - name: gateway
              containerPort: 3019
          startupProbe:
            httpGet:
              path: /health/live
              port: gateway
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: gateway
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext: &runtimeSecurity
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts: *runtimeMounts
        - name: research
          image: tsp-product-runtime:v0.5.0
          command: [/app/.venv/bin/python, -m, app.multitenancy.research_worker]
          env:
            - name: SERVICE_ROLE
              value: api
            - name: TSP_CELL_WORKER_CONCURRENCY
              value: "2"
          envFrom: *runtimeEnv
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext: *runtimeSecurity
          volumeMounts: *runtimeMounts
        - name: realtime
          image: tsp-product-runtime:v0.5.0
          command: [/app/.venv/bin/python, -m, app.multitenancy.runtime]
          env:
            - name: SERVICE_ROLE
              value: api
            - name: TSP_CELL_WORKER_CONCURRENCY
              value: "4"
          envFrom: *runtimeEnv
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext: *runtimeSecurity
          volumeMounts: *runtimeMounts
        - name: notifications
          image: tsp-product-runtime:v0.5.0
          command: [/app/.venv/bin/python, -m, app.multitenancy.notification_worker]
          env:
            - name: SERVICE_ROLE
              value: api
            - name: TSP_CELL_WORKER_CONCURRENCY
              value: "2"
          envFrom: *runtimeEnv
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext: *runtimeSecurity
          volumeMounts: *runtimeMounts
        - name: scheduled
          image: tsp-product-runtime:v0.5.0
          command: [/app/.venv/bin/python, -m, app.multitenancy.scheduled_worker]
          env:
            - name: SERVICE_ROLE
              value: api
            - name: TSP_CELL_WORKER_CONCURRENCY
              value: "2"
          envFrom: *runtimeEnv
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext: *runtimeSecurity
          volumeMounts: *runtimeMounts
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tsp-product-state
        - name: compute-socket
          emptyDir:
            sizeLimit: 16Mi
        - name: docker-graph
          emptyDir:
            sizeLimit: 12Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: registry-auth
          secret:
            secretName: banxia-registry
            items:
              - key: .dockerconfigjson
                path: config.json
