apiVersion: batch/v1
kind: Job
metadata:
  name: lss-database-bootstrap
  namespace: banxia
  labels:
    app: lss-database-bootstrap
    component: migration
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: lss-database-bootstrap
        component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: banxia-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:16.4-alpine
          command: [/bin/sh, -ec]
          args:
            - |
              export PGPASSWORD="$POSTGRES_PASSWORD"
              until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                sleep 5
              done
              psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                --set=ON_ERROR_STOP=1 \
                --set=control_password="$LSS_CONTROL_RUNTIME_PASSWORD" \
                --set=data_password="$LSS_DATA_RUNTIME_PASSWORD" <<'SQL'
              SELECT format(
                'CREATE ROLE lss_control_runtime WITH LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L',
                :'control_password'
              ) WHERE NOT EXISTS (
                SELECT 1 FROM pg_roles WHERE rolname = 'lss_control_runtime'
              )\gexec
              ALTER ROLE lss_control_runtime PASSWORD :'control_password';
              SELECT format(
                'CREATE ROLE lss_data_runtime WITH LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L',
                :'data_password'
              ) WHERE NOT EXISTS (
                SELECT 1 FROM pg_roles WHERE rolname = 'lss_data_runtime'
              )\gexec
              ALTER ROLE lss_data_runtime PASSWORD :'data_password';
              SELECT 'CREATE DATABASE lss_control' WHERE NOT EXISTS (
                SELECT 1 FROM pg_database WHERE datname = 'lss_control'
              )\gexec
              SELECT 'CREATE DATABASE lss_data_production' WHERE NOT EXISTS (
                SELECT 1 FROM pg_database WHERE datname = 'lss_data_production'
              )\gexec
              GRANT CONNECT ON DATABASE lss_control TO lss_control_runtime;
              GRANT CONNECT ON DATABASE lss_data_production TO lss_data_runtime;
              REVOKE CONNECT ON DATABASE lss_control FROM PUBLIC;
              REVOKE CONNECT ON DATABASE lss_data_production FROM PUBLIC;
              SQL
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: banxia-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: banxia-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banxia-secrets
                  key: POSTGRES_PASSWORD
            - name: LSS_CONTROL_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lss-product-admin
                  key: LSS_CONTROL_RUNTIME_PASSWORD
            - name: LSS_DATA_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lss-product-admin
                  key: LSS_DATA_RUNTIME_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lss-product-initialize
  namespace: banxia
  labels:
    app: lss-product-initialize
    component: migration
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: lss-product-initialize
        component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: banxia-workload
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: banxia-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: lss-product-runtime:v0.5.1
          command: [/bin/sh, -ec]
          args:
            - |
              /app/.venv/bin/python - <<'PY'
              import os
              import time
              import psycopg

              dsn = os.environ["LSS_CONTROL_ADMIN_DSN"]
              for attempt in range(120):
                  try:
                      with psycopg.connect(dsn, connect_timeout=3) as conn:
                          conn.execute("SELECT 1")
                      break
                  except Exception:
                      if attempt == 119:
                          raise
                      time.sleep(5)
              PY
              /app/.venv/bin/python -m app.cell.admin migrate \
                --kind control --runtime-role lss_control_runtime --target-version 6
              /app/.venv/bin/python -m app.cell.admin migrate \
                --kind data --runtime-role lss_data_runtime --cell-id production --target-version 6
              /app/.venv/bin/python -m app.cell.admin bootstrap-full-identity
              /app/.venv/bin/python -m app.cell.admin register-cell \
                --cell-id production --api-url https://shanao.asia
              /app/.venv/bin/python -m app.cell.admin bootstrap-full-workspace \
                --cell-id production
              /app/.venv/bin/python -m app.cell.admin sync-strategies
          env:
            - name: HOME
              value: /tmp
            - name: NUMBA_CACHE_DIR
              value: /tmp/numba
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - secretRef:
                name: lss-product-admin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
