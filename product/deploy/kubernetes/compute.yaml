apiVersion: v1
kind: Service
metadata:
  name: lss-compute
  namespace: banxia
  labels:
    app: lss-compute
spec:
  selector:
    app: lss-compute
  ports:
    - name: compute
      port: 7000
      targetPort: compute
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lss-compute
  namespace: banxia
  labels:
    app: lss-compute
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lss-compute
  template:
    metadata:
      labels:
        app: lss-compute
        component: compute
    spec:
      serviceAccountName: banxia-workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: banxia-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compute
          image: lss-product-compute:v0.5.1
          command:
            - /app/.venv/bin/python
            - -m
            - app.multitenancy.compute_broker
            - --listen
            - 0.0.0.0:7000
            - --market-root
            - /state/public
            - --capacity
            - "2"
          ports:
            - name: compute
              containerPort: 7000
          startupProbe:
            tcpSocket:
              port: compute
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: compute
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: compute
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: lss-product-state
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-lss-compute
  namespace: banxia
spec:
  podSelector:
    matchLabels:
      app: lss-compute
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                # API performs the readiness probe; tasks execute in the worker.
                values: [lss-product, lss-task-worker]
      ports:
        - protocol: TCP
          port: 7000
  egress: []
