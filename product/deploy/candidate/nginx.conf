user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 16m;
    keepalive_timeout 65;

    map $http_x_forwarded_proto $upstream_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    log_format main '$remote_addr - $request_method $uri $status '
                    '$body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout main;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    upstream lss_api {
        server lss-full-api:3018;
        keepalive 32;
    }

    upstream lss_gateway {
        server lss-full-gateway:3018;
        keepalive 16;
    }

    server {
        listen 8080;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /edge-health {
            access_log off;
            return 204;
        }

        location = /api/events {
            proxy_pass http://lss_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_proto;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 75s;
        }

        location = /api/events/ticket {
            proxy_pass http://lss_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_proto;
        }

        location / {
            proxy_pass http://lss_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_proto;
            proxy_read_timeout 900s;
        }
    }
}
