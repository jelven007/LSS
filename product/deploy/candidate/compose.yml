# Overlay for an isolated cloud-host candidate. Apply after deploy/full/compose.yml.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${LSS_CANDIDATE_POSTGRES_IMAGE:?Pinned PostgreSQL image required}
    env_file:
      - ${LSS_CANDIDATE_POSTGRES_ENV_FILE:?Private PostgreSQL environment required}
    environment:
      POSTGRES_USER: lss_admin
      POSTGRES_DB: lss_control
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=32MB
    ports:
      - "127.0.0.1:${LSS_CANDIDATE_PG_PORT:-35432}:5432"
    volumes:
      - candidate-pg:/var/lib/postgresql/data
      - ${LSS_CANDIDATE_PG_BOOTSTRAP:?PostgreSQL bootstrap path required}:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    networks: [pg, admin]
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 1g
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lss_admin -d lss_control"]
      interval: 10s
      timeout: 5s
      retries: 12

  initialize:
    profiles: [init]
    image: ${LSS_FULL_IMAGE:?Pinned full-product runtime image required}
    user: "10001:10001"
    env_file:
      - ${LSS_CANDIDATE_ADMIN_ENV_FILE:?Private migration environment required}
    environment:
      LSS_CANDIDATE_PUBLIC_URL: ${LSS_CANDIDATE_PUBLIC_URL:?Candidate HTTPS URL required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |-
        /app/.venv/bin/python -m app.cell.admin migrate --kind control --runtime-role lss_runtime --target-version 6
        /app/.venv/bin/python -m app.cell.admin migrate --kind data --runtime-role lss_runtime --cell-id candidate --target-version 6
        /app/.venv/bin/python -m app.cell.admin bootstrap-full-identity
        /app/.venv/bin/python -m app.cell.admin register-cell --cell-id candidate --api-url "$$LSS_CANDIDATE_PUBLIC_URL"
        /app/.venv/bin/python -m app.cell.admin sync-strategies
    networks: [pg]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  broker:
    image: ${LSS_BROKER_IMAGE:?Pinned compute-broker image required}
    user: "0:10001"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        rm -f /run/lss/compute.sock;
        exec /app/.venv/bin/python -m app.multitenancy.compute_broker
        --socket /run/lss/compute.sock
        --image "$$LSS_COMPUTE_IMAGE"
        --market-root "$$LSS_PUBLIC_MARKET_DIR"
        --capacity "$$LSS_COMPUTE_CAPACITY"
        --memory-mb "$$LSS_COMPUTE_MEMORY_MB"
        --cpus "$$LSS_COMPUTE_CPUS"
    environment:
      LSS_COMPUTE_IMAGE: ${LSS_COMPUTE_IMAGE:?Pinned compute image required}
      LSS_PUBLIC_MARKET_DIR: ${LSS_PUBLIC_MARKET_DIR:?Public release directory required}
      LSS_COMPUTE_CAPACITY: ${LSS_COMPUTE_CAPACITY:-2}
      LSS_COMPUTE_MEMORY_MB: ${LSS_COMPUTE_MEMORY_MB:-4096}
      LSS_COMPUTE_CPUS: ${LSS_COMPUTE_CPUS:-2}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LSS_COMPUTE_SOCKET_DIR:?Broker socket directory required}:/run/lss
      - ${LSS_PUBLIC_MARKET_DIR:?Public release directory required}:${LSS_PUBLIC_MARKET_DIR}:ro
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 40s
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "from app.multitenancy.executor import ComputeExecutor; assert ComputeExecutor('/run/lss/compute.sock').health()['ready']"]
      interval: 30s
      timeout: 8s
      retries: 3

  platform:
    networks: [default, market]
    logging: *logging

  api:
    ports: !reset []
    networks: [default, pg, edge, outbound]
    logging: *logging

  gateway:
    ports: !reset []
    logging: *logging

  research:
    logging: *logging

  realtime:
    logging: *logging

  notifications:
    networks: [default, pg, outbound]
    logging: *logging

  scheduled:
    logging: *logging

  edge:
    image: ${LSS_CANDIDATE_NGINX_IMAGE:?Pinned Nginx image required}
    volumes:
      - ${LSS_CANDIDATE_NGINX_CONFIG:?Candidate Nginx config required}:/etc/nginx/nginx.conf:ro
    ports:
      - "${LSS_CANDIDATE_BIND_ADDRESS:-127.0.0.1}:${LSS_CANDIDATE_HTTP_PORT:-38080}:8080"
    networks: [edge, ingress]
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=1m,noexec,nosuid
      - /tmp:size=4m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/edge-health"]
      interval: 15s
      timeout: 3s
      retries: 5

networks:
  default:
    internal: true
    name: ${COMPOSE_PROJECT_NAME:-lss-product-candidate}_internal
  pg:
    external: false
    internal: true
    name: ${COMPOSE_PROJECT_NAME:-lss-product-candidate}_pg
  edge:
    external: false
    internal: true
    name: ${COMPOSE_PROJECT_NAME:-lss-product-candidate}_edge
  admin: {}
  ingress: {}
  market: {}
  outbound: {}

volumes:
  candidate-pg:
    name: ${COMPOSE_PROJECT_NAME:-lss-product-candidate}_pg_data
